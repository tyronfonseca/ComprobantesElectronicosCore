name: Release - Comprobantes Electronicos Core

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # --------------------------------------------------------------------------
  # 1. Package Linux Artifacts
  # --------------------------------------------------------------------------
  package-linux:
    name: Package Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Libraries (Static & Shared)
        run: |
          cmake -B build_linux -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build_linux --config Release --parallel $(nproc)

      - name: Create Linux Distribution Tarball
        run: |
          mkdir -p dist/cec-linux-x86_64/include
          mkdir -p dist/cec-linux-x86_64/lib
          cp -r include/* dist/cec-linux-x86_64/include/
          cp build_linux/libComprobantesElectronicosCore.a dist/cec-linux-x86_64/lib/
          cp build_linux/libComprobantesElectronicosCore.so dist/cec-linux-x86_64/lib/ || true
          tar -czvf ComprobantesElectronicosCore-linux-x86_64-${{ github.ref_name }}.tar.gz -C dist cec-linux-x86_64

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cec-linux-x86_64
          path: ComprobantesElectronicosCore-linux-x86_64-${{ github.ref_name }}.tar.gz

  # --------------------------------------------------------------------------
  # 2. Package macOS & XCFramework Artifacts
  # --------------------------------------------------------------------------
  package-macos:
    name: Package macOS & XCFramework
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build macOS Universal Libraries
        run: |
          cmake -B build_macos -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DBUILD_TESTING=OFF
          cmake --build build_macos --config Release --parallel $(sysctl -n hw.ncpu)

      - name: Create macOS Distribution Tarball
        run: |
          mkdir -p dist/cec-macos-universal/include
          mkdir -p dist/cec-macos-universal/lib
          cp -r include/* dist/cec-macos-universal/include/
          cp build_macos/libComprobantesElectronicosCore.a dist/cec-macos-universal/lib/
          cp build_macos/libComprobantesElectronicosCore.dylib dist/cec-macos-universal/lib/ || true
          tar -czvf ComprobantesElectronicosCore-macos-universal-${{ github.ref_name }}.tar.gz -C dist cec-macos-universal

      - name: Build XCFramework (if script available)
        run: |
          if [ -f scripts/build_xcframework.sh ]; then
            chmod +x scripts/build_xcframework.sh
            ./scripts/build_xcframework.sh || true
            if [ -d dist/ComprobantesElectronicosCore.xcframework ] || [ -d dist/ComprobantesElectronicosCore.xcframework ]; then
              cd dist && zip -r ../ComprobantesElectronicosCore.xcframework.zip *.xcframework && cd ..
            fi
          fi

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cec-macos-universal
          path: ComprobantesElectronicosCore-macos-universal-${{ github.ref_name }}.tar.gz

  # --------------------------------------------------------------------------
  # 3. Package Windows Artifacts
  # --------------------------------------------------------------------------
  package-windows:
    name: Package Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Disable Windows Defender for Workspace
        shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Caché de vcpkg
        uses: actions/cache@v4
        with:
          # vcpkg compila OpenSSL desde el código fuente; con la caché solo ocurre la primera vez
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-openssl-x64-windows-release-${{ runner.os }}

      - name: Instalar OpenSSL con vcpkg (solo release)
        run: vcpkg install openssl:x64-windows-release

      - name: Build Windows Static Library (MSVC + Ninja)
        run: |
          cmake -B build_win_static -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTING=OFF -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-release
          ninja -C build_win_static

      - name: Build Windows Shared Library (MSVC + Ninja)
        run: |
          cmake -B build_win_shared -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DBUILD_TESTING=OFF -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-release
          ninja -C build_win_shared

      - name: Create Windows Zip Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/cec-windows-x64/include
          New-Item -ItemType Directory -Force -Path dist/cec-windows-x64/lib
          Copy-Item -Recurse include/* dist/cec-windows-x64/include/
          Get-ChildItem -Path build_win_static -Filter "*.lib" -Recurse | Copy-Item -Destination dist/cec-windows-x64/lib/
          Get-ChildItem -Path build_win_shared -Filter "*.dll" -Recurse | Copy-Item -Destination dist/cec-windows-x64/lib/
          Compress-Archive -Path dist/cec-windows-x64 -DestinationPath ComprobantesElectronicosCore-windows-x64-${{ github.ref_name }}.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cec-windows-x64
          path: ComprobantesElectronicosCore-windows-x64-${{ github.ref_name }}.zip

  # --------------------------------------------------------------------------
  # 4. Create GitHub Release with Attached Assets
  # --------------------------------------------------------------------------
  publish-release:
    name: Publish GitHub Release
    needs: [package-linux, package-macos, package-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Generate Checksums (SHA256)
        working-directory: release_assets
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
